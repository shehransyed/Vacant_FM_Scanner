<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>FM Channel Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%93%BB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">📻 FM Channel Finder</div>
  <nav id="mode-tabs">
    <button id="tab-point" class="tab active">Location</button>
    <button id="tab-route" class="tab">Route</button>
  </nav>
</header>

<div id="map"></div>

<main id="panel">
  <!-- ============ LOCATION MODE ============ -->
  <section id="point-controls" class="controls">
    <div class="input-row">
      <button id="btn-locate" class="btn primary" title="Use device GPS">📍 My location</button>
      <input id="point-search" type="search" placeholder="…or search a place / address" autocomplete="off">
      <button id="btn-point-search" class="btn">Go</button>
    </div>
    <div class="hint">Tip: you can also tap anywhere on the map.</div>
  </section>

  <!-- ============ ROUTE MODE ============ -->
  <section id="route-controls" class="controls hidden">
    <div class="input-row">
      <input id="route-from" type="search" placeholder="From (blank = my location)" autocomplete="off">
    </div>
    <div class="input-row">
      <input id="route-to" type="search" placeholder="To — address or place" autocomplete="off">
      <button id="btn-route" class="btn primary">Route</button>
    </div>
    <details id="gmaps-details">
      <summary>Paste a Google Maps link instead</summary>
      <div class="input-row">
        <input id="gmaps-url" type="url" placeholder="https://www.google.com/maps/dir/…" autocomplete="off">
        <button id="btn-gmaps" class="btn">Parse</button>
      </div>
      <div class="hint">Short links (maps.app.goo.gl) can't be read directly — open the link
      in a browser first, then copy the full <b>google.com/maps/dir/…</b> address from the
      address bar and paste it here.</div>
    </details>
  </section>

  <div id="status" class="hidden"></div>
  <div id="results"></div>
</main>

<script src="stations.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
